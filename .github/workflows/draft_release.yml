name: Draft Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/pull_request.yml

  build:
    name: Package (${{ matrix.target }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            rustflags: '-C target-feature=+crt-static'
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and smoke-test the extracted binary
        run: python pkg/release.py package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: Create complete draft
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: python pkg/release.py verify
      - run: python pkg/release.py scoop
      - name: Create or resume this commit's draft
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(python pkg/release.py version)
          tag="v$version"
          if gh release view "$tag" --json isDraft,targetCommitish > /tmp/release.json; then
            jq -e --arg sha "$RELEASE_SHA" '.isDraft and .targetCommitish == $sha' /tmp/release.json
          else
            # Refuse to associate new assets with an already-existing tag.
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists; bump the version first" >&2
              exit 1
            fi
            gh release create "$tag" --target "$RELEASE_SHA" --draft --generate-notes --title "$tag"
          fi
          gh release upload "$tag" dist/* --clobber
