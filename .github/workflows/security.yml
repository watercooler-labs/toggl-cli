name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --locked --version 0.22.0
      # Vulnerabilities and yanked packages block releases. See SECURITY.md for
      # the remaining maintenance warnings and the atty advisory assessment.
      - run: cargo audit --deny yanked
